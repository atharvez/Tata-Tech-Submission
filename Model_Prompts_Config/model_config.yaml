# AUTOSAR-AI Model & Retrieval Configuration
# Aligned with Tata Technologies Automotive Reference Solution (Case Study 1)

project:
  name: "AUTOSAR HLD Document Analysis Assistant"
  version: "1.0.0"
  organization: "PCCOE Department of AI & ML / Tata Technologies Ltd."
  candidate: "Atharva Desai"
  prn: "123B1D059"

retrieval:
  dense_weight: 0.55
  bm25_weight: 0.45
  top_k: 3
  similarity_threshold: 0.15
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  chunk_strategy: "hierarchical_section_preserving"
  target_chunk_size: 500
  chunk_overlap: 50

llm:
  provider: "Google Gemini / Fallback Deterministic Grounded Engine"
  primary_model: "gemini-1.5-pro"
  fallback_model: "gemini-1.5-flash"
  temperature: 0.1
  max_output_tokens: 1500
  strict_citations: true
  zero_hallucination_guardrail: true

deterministic_rules:
  validate_port_matching: true
  enforce_datatype_consistency: true
  flag_dangling_ports: true
  check_revision_diffs: true
  max_allowable_speed_kmh: 255
